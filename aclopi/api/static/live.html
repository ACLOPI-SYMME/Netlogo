<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACLOPI – prueba en vivo</title>
<style>
  body { font-family: sans-serif; margin: 12px; }
  fieldset { margin-bottom: 8px; }
  input { width: 6em; }
  #main { display: flex; gap: 12px; flex-wrap: wrap; }
  canvas { border: 1px solid #999; background: #fff; }
  #side { min-width: 280px; max-width: 420px; }
  #events { height: 260px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #ccc; padding: 4px; }
  pre { font-size: 12px; margin: 4px 0; }
  .err { color: #b00; }
</style>
</head>
<body>
<h3>ACLOPI – sesión en vivo (página de prueba)</h3>
<fieldset>
  Semilla <input id="seed" type="number" value="42">
  Regla <select id="rule"><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
  Horizonte <input id="horizon" type="number" value="10000">
  <button id="create">Crear sesión</button>
  <span id="sid"></span>
</fieldset>
<fieldset>
  Velocidad <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
  <button id="live">En vivo</button>
  <button id="fast">Rápido</button>
  <button id="pause">Pausa</button>
  <button id="resume">Reanudar</button>
  <button id="reset">Reiniciar</button>
  <button id="close">Cerrar</button>
</fieldset>
<div>Tick: <b id="tick">–</b> · Estado: <b id="runstate">–</b> · Ritmo: <span id="rate">–</span> · <span id="msg"></span></div>
<div id="main">
  <canvas id="plant" width="760" height="520"></canvas>
  <div id="side">
    <b>KPIs</b><pre id="kpis">–</pre>
    <b>Eventos</b> (últimos 200)<div id="events"></div>
  </div>
</div>
<script>
"use strict";
const DELAY_MS = 400;           // playback buffer
const MAX_EVENTS = 200;
const MAX_INTERP_MS = 300;      // frames further apart are not interpolated
let sid = null, ws = null, layout = null, frames = [], events = [];
const $ = id => document.getElementById(id);

function msg(text, error) { $("msg").textContent = text; $("msg").className = error ? "err" : ""; }

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json"},
                               body: body ? JSON.stringify(body) : undefined});
  if (r.status === 204) return null;
  const data = await r.json();
  if (!r.ok) throw new Error(`${r.status} ${data.code || ""}: ${typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)}`);
  return data;
}
async function act(fn) { try { const info = await fn(); if (info && info.run_state) showRun(info); } catch (e) { msg(e.message, true); } }
function showRun(info) { $("runstate").textContent = info.run_state + (info.mode ? ` (${info.mode}${info.speed ? " " + info.speed + "×" : ""})` : ""); }

$("create").onclick = () => act(async () => {
  if (sid) { await api("DELETE", `/sessions/${sid}`).catch(() => {}); }
  const info = await api("POST", "/sessions", {seed: +$("seed").value, rule: +$("rule").value, horizon_ticks: +$("horizon").value});
  sid = info.session_id; $("sid").textContent = sid; connect(); return info;
});
$("live").onclick = () => act(() => api("POST", `/sessions/${sid}/run`, {mode: "live", speed: +$("speed").value}));
$("fast").onclick = () => act(() => api("POST", `/sessions/${sid}/run`, {mode: "fast"}));
$("pause").onclick = () => act(() => api("POST", `/sessions/${sid}/pause`));
$("resume").onclick = () => act(() => api("POST", `/sessions/${sid}/resume`));
$("reset").onclick = () => act(() => api("POST", `/sessions/${sid}/reset`));
$("close").onclick = () => act(async () => { await api("DELETE", `/sessions/${sid}`); sid = null; $("sid").textContent = ""; });

function connect() {
  if (ws) ws.close();
  frames = []; events = [];
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/sessions/${sid}`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = e => msg(`WebSocket cerrado (${e.code} ${e.reason})`, e.code !== 1000);
}

function addEvents(list) {
  events.push(...list);
  if (events.length > MAX_EVENTS) events = events.slice(-MAX_EVENTS);
  $("events").textContent = events.map(ev => `${ev.tick} ${ev.event} p${ev.who} ${ev.location ?? ""} → ${ev.destination ?? ""}`).join("\n");
  $("events").style.whiteSpace = "pre"; $("events").scrollTop = 1e9;
}
function addFrame(tick, state) {
  if (!state) return;
  const products = new Map(state.products.map(p => [p.id, p]));
  frames.push({t: performance.now(), tick, products});
  if (frames.length > 60) frames.shift();
}
function showKpis(k) {
  if (!k) return;
  const u = Object.entries(k.utilization).map(([m, v]) => `${m} ${(100 * v).toFixed(0)}%`).join(" ");
  $("kpis").textContent = `ticks ${k.ticks}  creados ${k.created ?? "–"}  terminados ${k.finished}  WIP ${k.wip}\n` +
    `throughput ${k.throughput.toFixed(5)}  flujo medio ${k.mean_flow_time === null ? "–" : k.mean_flow_time.toFixed(1)}` +
    ` (desde la 1.ª operación)\ntrabajo completado ${k.work_completed === undefined ? "–" : k.work_completed.toFixed(1)}\n${u}`;
}

function handle(m) {
  switch (m.type) {
    case "snapshot":
      layout = m.layout; frames = []; events = [];
      showRun(m.session); $("tick").textContent = m.tick; showKpis(m.kpis);
      addEvents(m.recent_events || []); addFrame(m.tick, m.state); break;
    case "tick":
      $("tick").textContent = m.tick; $("rate").textContent = m.rate ? `${m.rate} ticks/s` : "–";
      addFrame(m.tick, m.state); addEvents(m.events); showKpis(m.kpis); break;
    case "progress":
      $("tick").textContent = m.tick; $("rate").textContent = m.ticks_per_s ? `${Math.round(m.ticks_per_s)} ticks/s` : "–";
      addFrame(m.tick, m.state);  // fast mode: platform-state about once a second (accelerated video)
      addEvents(m.events); showKpis(m.kpis); break;
    case "run_state": showRun(m); break;
    case "finished": showKpis(m.kpis); msg(`Corrida terminada en el tick ${m.tick}`); break;
    case "resync": msg(`Resincronizando (${m.reason}, ${m.dropped} mensajes descartados)`); break;
    case "run_error": msg(`Error en la corrida: ${m.error}`, true); break;
    case "closed": msg(`Sesión cerrada: ${m.code} – ${m.reason}`, true); break;
  }
}

// ----- drawing -----
const canvas = $("plant"), ctx = canvas.getContext("2d");
function transform() {
  const pts = layout.nodes.concat(layout.machines);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const s = Math.min((canvas.width - 40) / (maxX - minX || 1), (canvas.height - 40) / (maxY - minY || 1));
  return p => [20 + (p.x - minX) * s, canvas.height - 20 - (p.y - minY) * s];
}
function framePair(t) {
  for (let i = frames.length - 1; i > 0; i--) {
    if (frames[i - 1].t <= t) return [frames[i - 1], frames[i]];
  }
  return frames.length ? [frames[0], frames[0]] : [null, null];
}
function draw() {
  requestAnimationFrame(draw);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!layout) return;
  const tf = transform();
  const nodes = new Map(layout.nodes.map(n => [n.id, n]));
  ctx.strokeStyle = "#999"; ctx.lineWidth = 2;
  for (const c of layout.conveyors) {
    const a = nodes.get(c.from), b = nodes.get(c.to);
    if (!a || !b) continue;
    const [x1, y1] = tf(a), [x2, y2] = tf(b);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.fillStyle = "#ccc";
  for (const n of layout.nodes) { const [x, y] = tf(n); ctx.fillRect(x - 2, y - 2, 4, 4); }
  ctx.fillStyle = "#246"; ctx.font = "12px sans-serif";
  for (const m of layout.machines) { const [x, y] = tf(m); ctx.fillRect(x - 6, y - 6, 12, 12); ctx.fillText(m.name, x + 8, y - 8); }
  // products, interpolated DELAY_MS behind the newest frame
  const t = performance.now() - DELAY_MS;
  const [a, b] = framePair(t);
  if (!a) return;
  // Interpolate only between close frames (live mode); fast-mode frames are ~1 s apart: show the latest.
  const f = b === a || b.t === a.t || b.t - a.t > MAX_INTERP_MS ? 1 : Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t)));
  ctx.fillStyle = "#d33";
  for (const [id, pb] of b.products) {
    const pa = a.products.get(id) || pb;
    const [x, y] = tf({x: pa.x + (pb.x - pa.x) * f, y: pa.y + (pb.y - pa.y) * f});
    ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * Math.PI); ctx.fill();
  }
}
requestAnimationFrame(draw);
</script>
</body>
</html>
