[pytest]
testpaths = tests
# The JVM raises and handles access violations internally on Windows; faulthandler would print them as crashes.
# Slow tests (100,000-tick runs) are excluded by default; run them with `python -m pytest -m slow`.
addopts = -p no:faulthandler -m "not slow"
markers =
    slow: long-run regression (100,000 ticks per case), excluded from the normal run
