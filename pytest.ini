[pytest]
testpaths = tests
# The JVM raises and handles access violations internally on Windows; faulthandler would print them as crashes.
# Groups (markers set in tests/conftest.py by file; CLAUDE.md, rule 4):
#   unit  no NetLogo, always            pytest -m unit
#   (no marker) integration with NetLogo
#   api   API end to end with workers   pytest -m "api and not slow"   (never with -n: live tests measure the pace)
#   slow  100,000-tick runs             pytest -m "slow and not api" -n 4   (pytest-xdist, only here)
#                                       pytest -m "slow and api"            (slow API tests: whole pools, live; serial)
# The default run is everything but api and slow.
addopts = -p no:faulthandler -m "not api and not slow"
markers =
    unit: no NetLogo (pure Python, mocks); run always
    api: API end to end with session and what-if workers (test_whatif, test_live, test_agent_decisions, test_workers, test_api); before a merge
    slow: long-run regression (100,000 ticks per case), excluded from the normal run
