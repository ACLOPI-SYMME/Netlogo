# ACLOPI local stack (L5.7): platform API + DynamoDB Local + Linea A's real agent (profile "agent", the default of
# docker/up) or the mock agent (profile "mock", only for automatic tests). docs/deploy-local.md.
# Only the platform publishes a port (8000); the other services live on the internal network.
# ACLOPI_AGENT_TOKEN comes from .env (not in git; see .env.example).
name: aclopi

services:
  platform:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: aclopi-sim
    command: ["python", "-m", "aclopi.api"]
    ports:
      - "8000:8000"
    environment:
      # Set by docker/up.ps1 / up.sh for the agent started (real: agent, the default; mock: agent-mock). Do not put
      # it in .env: it would apply to every start whatever agent runs (docs/deploy-local.md).
      ACLOPI_AGENT_URL: ${ACLOPI_AGENT_URL:-http://agent:8100}
      ACLOPI_AGENT_TOKEN: ${ACLOPI_AGENT_TOKEN:-}
      ACLOPI_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      ACLOPI_CREATE_TABLES: "1"
      ACLOPI_AWS_REGION: ${ACLOPI_AWS_REGION:-eu-north-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - ./results:/app/results
    depends_on:
      dynamodb-local:
        condition: service_started
    restart: unless-stopped
    cpus: 4
    cpuset: "0-3"
    mem_limit: 6g
    memswap_limit: 6g
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 3
    networks: [internal]

  # Mock agent: only for automatic tests (docker/up.ps1 -Agent mock, scripts/l5/smoke_compose.py --up mock).
  agent-mock:
    profiles: [mock]
    image: aclopi-sim
    command: ["python", "-m", "aclopi.agent_mock"]
    environment:
      ACLOPI_PLATFORM_URL: http://platform:8000
      ACLOPI_AGENT_TOKEN: ${ACLOPI_AGENT_TOKEN:-}
      ACLOPI_MOCK_PORT: "8100"
      ACLOPI_MOCK_SEED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [internal]

  # Linea A's agent: the platform's agent. Start the stack with docker/up.ps1 (or docker/up.sh), which turns this
  # profile on; stop everything with docker/down.ps1 / down.sh (down --profile "*": a plain
  # `docker compose down` ignores the profiles and leaves the agents running).
  # LLM and triage settings come from .env.agent (not in git; see .env.agent.example; without it: fake LLM).
  # Only the internal values are fixed here: environment wins over env_file.
  agent:
    profiles: [agent]
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: aclopi-agent
    env_file:
      - path: .env.agent
        required: false
    environment:
      ACLOPI_PLATFORM_URL: http://platform:8000
      ACLOPI_AGENT_TOKEN: ${ACLOPI_AGENT_TOKEN:-}
      ACLOPI_AGENT_LOG: /app/results/agent/decisions.jsonl
    volumes:
      - ./results:/app/results
    restart: "no"  # unless-stopped brought an old agent back with every Docker start
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [internal]

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped
    networks: [internal]

networks:
  internal: {}
